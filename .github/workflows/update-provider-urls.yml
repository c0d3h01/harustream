name: Update Provider URLs

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe providers and refresh URLs
        run: pnpm providers:update-urls
      - name: Open PR when a provider URL changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if git diff --exit-code --quiet -- src/providers/urls.ts; then
            echo "::notice::Provider URLs are unchanged — no PR needed."
            exit 0
          fi
          BASE_BRANCH="${GITHUB_REF_NAME}"
          BRANCH="chore/provider-url-update-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/providers/urls.ts
          git commit -m "chore(providers): refresh provider URLs"
          git push origin "$BRANCH"
          gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "chore(providers): refresh provider URLs" \
            --body "Auto-generated by the Update Provider URLs workflow (manual trigger): re-probing found one or more providers moved, so src/providers/urls.ts is refreshed. Review and merge."