# Hosts the multi-provider egress proxy (scripts/ci-proxy.mjs) on a GitHub
# Actions runner and exposes it through a Cloudflare quick-tunnel so
# harustream deployments can route blocked-provider streams through GitHub's
# egress IP instead of Vercel's datacenter ranges.
#
# Run modes:
#  - workflow_dispatch: manual run, keeps the runner alive for `timeout-minutes`
#  - schedule:          optional recurring keep-alive (see cron comment below)
#
# The tunnel URL changes every run. After starting, the workflow prints:
#   PROXY_URL=https://<random>.trycloudflare.com
# in the "tunnel" step summary and job log. Point harustream's
# STREAM_EGRESS_PROXY_URL at that value for the session.
#
# NOTE: GitHub-hosted runners have a 6h job cap; use workflow_dispatch with a
# timeout that matches how long you need the proxy, or self-host a runner for
# a permanent endpoint.

name: egress-proxy

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to keep the proxy alive'
        default: '360'
        required: false

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 6 # hard cap; inputs cannot exceed this on hosted runners
    steps:
      - uses: actions/checkout@v4

      - name: Start proxy server
        run: |
          node scripts/ci-proxy.mjs &
          echo $! > /tmp/proxy.pid
          for i in $(seq 1 20); do
            curl -sf http://localhost:8787/healthz && break
            sleep 0.5
          done

      - name: Start cloudflared tunnel
        run: |
          curl -sL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://localhost:8787 --no-autoupdate > /tmp/tunnel.log 2>&1 &
          for i in $(seq 1 40); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1)
            if [ -n "$URL" ]; then
              echo "PROXY_URL=$URL" >> "$GITHUB_ENV"
              echo "PROXY_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
              echo "PROXY_URL=$URL"
              break
            fi
            sleep 1
          done
          [ -n "$URL" ] || { cat /tmp/tunnel.log; exit 1; }

      - name: Verify end-to-end through tunnel
        run: |
          # trycloudflare DNS can lag a few seconds behind the tunnel coming up;
          # retry until healthz answers or give up after ~60s.
          ok=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$PROXY_URL/healthz" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 2
          done
          [ -n "$ok" ] || exit 1

      - name: Keep alive
        run: |
          MINUTES=${{ inputs.minutes || '360' }}
          echo "proxy live at $PROXY_URL for ${MINUTES}m"
          sleep "${MINUTES}m"

      - name: Teardown summary
        if: always()
        run: echo "proxy shut down at $(date -u +%H:%M:%S) UTC"
