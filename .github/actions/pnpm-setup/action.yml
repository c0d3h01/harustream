# pnpm + Node setup shared by every CI job.
# Checkout, install pnpm, configure Node with pnpm cache, install frozen deps.
inputs:
  node-version:
    description: Node version to use
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 11.2.2
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile